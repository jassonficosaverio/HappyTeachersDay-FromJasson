<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Hari Guru Nasional - Bu Kora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #172554 100%);
      font-family: 'Quicksand', sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px 80px;
    }

    /* Background Stars & Floating Elements */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.4;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.5;
      }
      85% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    /* Stage 1: Envelope Cover */
    .cover-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 34px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cover-card.hide {
      opacity: 0;
      transform: scale(0.85) translateY(-20px);
      pointer-events: none;
      display: none;
    }

    .stars-top {
      font-size: 1.1rem;
      letter-spacing: 6px;
      color: #fde047;
      margin-bottom: 10px;
      animation: pulse 2s infinite ease-in-out;
    }

    .badge-date {
      display: inline-block;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .apple-icon {
      font-size: 3rem;
      display: block;
      margin: 4px auto 10px;
      animation: bounce 2.2s infinite ease-in-out;
      filter: drop-shadow(0 6px 12px rgba(239, 68, 68, 0.35));
    }

    h1.main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.9rem;
      line-height: 1.25;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #93c5fd, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.96rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .from-tag {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Envelope Preview Box */
    .envelope-box {
      background: linear-gradient(145deg, rgba(30, 58, 138, 0.6), rgba(15, 23, 42, 0.8));
      border: 1.5px dashed rgba(147, 197, 253, 0.45);
      border-radius: 20px;
      padding: 20px;
    }

    .envelope-label {
      font-family: 'Sacramento', cursive;
      font-size: 2.25rem;
      color: #fde047;
      margin-bottom: 2px;
    }

    .teacher-full-name {
      font-size: 0.92rem;
      color: #bae6fd;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .btn-open {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-open:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.65);
    }

    /* Stage 2: Letter Card */
    .letter-card {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      animation: popIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .letter-card.show {
      display: block;
    }

    /* Area Foto Guru + Stiker */
    .media-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .teacher-photo-frame {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 24px;
      padding: 5px;
      background: linear-gradient(135deg, #fde047, #38bdf8, #818cf8);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease;
    }

    .teacher-photo-frame:hover {
      transform: scale(1.03);
    }

    .teacher-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .teacher-photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder {
      padding: 10px;
      text-align: center;
      color: #cbd5e1;
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .photo-placeholder span {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 4px;
    }

    .photo-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.85);
      color: #fde047;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(253, 224, 71, 0.45);
    }

    .sticker-wrapper {
      width: 105px;
      height: 105px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .sticker-wrapper img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      border-radius: 50%;
    }

    .letter-heading {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.42rem;
      color: #fde047;
      margin-bottom: 4px;
    }

    .letter-subheading {
      font-size: 0.9rem;
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .message-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px;
      min-height: 170px;
      text-align: left;
      font-size: 0.96rem;
      line-height: 1.7;
      color: #f1f5f9;
      margin-bottom: 18px;
      position: relative;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: #38bdf8;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    /* Bar Kontrol Media (Foto, Lagu, Ulangi) */
    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 10px 15px;
      border-radius: 999px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Music Controls Floating Bar */
    .music-controls {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .music-upload-btn {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      transition: background 0.2s ease;
    }

    .music-upload-btn:hover {
      background: rgba(30, 58, 138, 0.85);
    }

    .music-toggle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .music-toggle.playing {
      animation: spinSlow 5s linear infinite;
      border-color: #fde047;
      color: #fde047;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(25px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Floating Particles -->
  <div class="bg-particles" id="particles"></div>

  <!-- =========================================================
       TEMPAT MEMASANG LAGU:
       1. Permanen di GitHub: Upload file lagu MP3 ke folder yang
          sama dengan index.html dan beri nama "lagu-guru.mp3"
          (atau ubah nama filenya pada bagian CONFIG di bawah).
       2. Pratinjau Langsung: Klik tombol "🎵 Pasang Lagu" di layar.
       ========================================================= -->
  <audio id="bgMusic" loop>
    <source id="musicSource" src="lagu-guru.mp3" type="audio/mpeg">
  </audio>

  <!-- Input File Tersembunyi untuk Foto & Lagu -->
  <input type="file" id="photoInput" accept="image/*" hidden />
  <input type="file" id="audioInput" accept="audio/*" hidden />

  <div class="music-controls">
    <button class="music-upload-btn" id="changeMusicBtn" title="Pilih file lagu MP3 dari HP/Laptop">🎵 Pasang Lagu</button>
    <button class="music-toggle" id="musicBtn" title="Putar / Jeda Lagu">♪♫</button>
  </div>

  <main class="container">
    <!-- COVER / AMPLOP AWAL -->
    <section class="cover-card" id="coverCard">
      <div class="stars-top">★★ 🍎 ★★</div>
      <div class="badge-date">25 November 2026</div>
      <h1 class="main-title">Selamat Hari Guru Nasional</h1>
      <p class="subtitle">
        Terima kasih, Bu Kora,<br />
        pahlawan tanpa tanda jasa 💙
      </p>

      <div class="envelope-box">
        <div class="envelope-label">Untuk Bu Kora</div>
        <div class="teacher-full-name">Ibu Korawati (Rara)</div>
        <span class="apple-icon">🍎</span>
        <p class="from-tag">Teruntuk Bu Kora 🫶 dari murid-muridmu</p>
        <button class="btn-open" id="openBtn">
          <span>✉️</span> Buka Surat
        </button>
      </div>
    </section>

    <!-- ISI SURAT / KARTU UCAPAN -->
    <section class="letter-card" id="letterCard">
      <div class="media-header">
        <!-- =========================================================
             TEMPAT MEMASANG GAMBAR / FOTO BU KORA:
             1. Permanen di GitHub: Upload foto ke folder yang sama
                dengan nama "foto-bu-kora.jpg" (atau ubah di CONFIG).
             2. Pratinjau Langsung: Klik bingkai foto ini untuk memilih
                gambar dari galeri HP / folder laptop.
             ========================================================= -->
        <div class="teacher-photo-frame" id="photoFrame" title="Klik untuk pasang foto Bu Kora">
          <div class="teacher-photo-inner">
            <img id="teacherImg" src="foto-bu-kora.jpg" alt="Foto Bu Kora" style="display: none;" />
            <div class="photo-placeholder" id="photoPlaceholder">
              <span>🖼️</span>
              Klik untuk pasang foto Bu Kora
            </div>
            <div class="photo-badge">📸 Foto</div>
          </div>
        </div>

        <!-- Stiker Panda -->
        <div class="sticker-wrapper">
          <img id="stickerImg" src="https://htmlku.com/0/panda/hearthappy.gif" alt="Stiker Lucu" />
        </div>
      </div>

      <h2 class="letter-heading">Selamat Hari Guru, Bu Kora! 🍎💙</h2>
      <div class="letter-subheading">Ibu Korawati (Rara)</div>

      <div class="message-box">
        <span id="typedText"></span><span class="cursor" id="cursor"></span>
      </div>

      <div class="action-row">
        <button class="btn-secondary" id="changePhotoBtn">🖼️ Pasang Foto</button>
        <button class="btn-secondary" id="changeMusicBtn2">🎵 Pasang Lagu</button>
        <button class="btn-secondary" id="replayBtn">🔄 Ulangi</button>
      </div>
    </section>
  </main>

  <script>
    // =========================================================
    // PENGATURAN FILE FOTO, LAGU & ISI SURAT (UNTUK GITHUB)
    // =========================================================
    const CONFIG = {
      // Nama file gambar yang di-upload ke GitHub (pastikan nama & ekstensi sama)
      fotoGuru: "foto-bu-kora.jpg",

      // Nama file lagu MP3 yang di-upload ke GitHub (pastikan nama & ekstensi sama)
      laguLatar: "lagu-guru.mp3",

      // Isi pesan ucapan untuk Ibu Korawati (Rara) / Bu Kora
      pesanUcapan:
        "Selamat Hari Guru Nasional untuk Ibu Korawati (Rara), atau yang selalu kami panggil dengan penuh sayang, Bu Kora. " +
        "Terima kasih atas setiap ilmu, kesabaran, perhatian, dan ketulusan Bu Kora dalam membimbing kami setiap hari. " +
        "Semoga Bu Kora selalu diberikan kesehatan, kebahagiaan, kelancaran rezeki, dan keberkahan dalam setiap langkah. " +
        "Kami bangga dan bersyukur memiliki guru sebaik Bu Kora! 💙🍎",

      stikerAwal: "https://htmlku.com/0/panda/hearthappy.gif",
      stikerAkhir: "https://htmlku.com/0/panda/muah.gif"
    };

    // Floating Particles
    const particlesContainer = document.getElementById("particles");
    const icons = ["🍎", "💙", "✨", "⭐", "📚", "🎓"];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement("span");
      el.className = "particle";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 8 + Math.random() * 10 + "s";
      el.style.animationDelay = Math.random() * 8 + "s";
      el.style.fontSize = 0.9 + Math.random() * 0.9 + "rem";
      particlesContainer.appendChild(el);
    }

    // Elements
    const coverCard = document.getElementById("coverCard");
    const letterCard = document.getElementById("letterCard");
    const openBtn = document.getElementById("openBtn");
    const replayBtn = document.getElementById("replayBtn");
    const typedText = document.getElementById("typedText");
    const cursor = document.getElementById("cursor");
    const stickerImg = document.getElementById("stickerImg");

    // Photo Elements
    const photoFrame = document.getElementById("photoFrame");
    const changePhotoBtn = document.getElementById("changePhotoBtn");
    const photoInput = document.getElementById("photoInput");
    const teacherImg = document.getElementById("teacherImg");
    const photoPlaceholder = document.getElementById("photoPlaceholder");

    // Music Elements
    const bgMusic = document.getElementById("bgMusic");
    const musicSource = document.getElementById("musicSource");
    const musicBtn = document.getElementById("musicBtn");
    const changeMusicBtn = document.getElementById("changeMusicBtn");
    const changeMusicBtn2 = document.getElementById("changeMusicBtn2");
    const audioInput = document.getElementById("audioInput");

    let typingTimer = null;
    let isPlaying = false;

    // Load default photo from repository if available
    teacherImg.src = CONFIG.fotoGuru;
    teacherImg.onload = () => {
      teacherImg.style.display = "block";
      photoPlaceholder.style.display = "none";
    };
    teacherImg.onerror = () => {
      teacherImg.style.display = "none";
      photoPlaceholder.style.display = "block";
    };

    // Load default audio from repository
    musicSource.src = CONFIG.laguLatar;
    bgMusic.load();

    // Photo Picker
    photoFrame.addEventListener("click", () => photoInput.click());
    changePhotoBtn.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          teacherImg.src = event.target.result;
          teacherImg.style.display = "block";
          photoPlaceholder.style.display = "none";
        };
        reader.readAsDataURL(file);
      }
    });

    // Music Control & Picker
    function playMusic() {
      bgMusic.play().then(() => {
        isPlaying = true;
        musicBtn.classList.add("playing");
      }).catch(() => {
        isPlaying = false;
      });
    }

    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        musicBtn.classList.remove("playing");
      } else {
        playMusic();
      }
    });

    changeMusicBtn.addEventListener("click", () => audioInput.click());
    changeMusicBtn2.addEventListener("click", () => audioInput.click());

    audioInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const audioURL = URL.createObjectURL(file);
        bgMusic.src = audioURL;
        bgMusic.load();
        playMusic();
        const shortName = file.name.slice(0, 14) + (file.name.length > 14 ? "..." : "");
        changeMusicBtn.textContent = "🎵 " + shortName;
      }
    });

    // Typewriter Effect
    function startTyping() {
      clearInterval(typingTimer);
      typedText.textContent = "";
      cursor.style.display = "inline-block";
      stickerImg.src = CONFIG.stikerAwal;

      let idx = 0;
      const text = CONFIG.pesanUcapan;

      typingTimer = setInterval(() => {
        if (idx < text.length) {
          typedText.textContent += text.charAt(idx);
          idx++;
        } else {
          clearInterval(typingTimer);
          cursor.style.display = "none";
          stickerImg.src = CONFIG.stikerAkhir;
        }
      }, 36);
    }

    // Open Letter
    openBtn.addEventListener("click", () => {
      playMusic();
      coverCard.classList.add("hide");
      letterCard.classList.add("show");
      startTyping();
    });

    // Replay
    replayBtn.addEventListener("click", () => {
      startTyping();
    });
  </script>
</body>
</html>
