<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Hari Guru Nasional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #172554 100%);
      font-family: 'Quicksand', sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Background Stars & Floating Elements */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.4;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.5;
      }
      85% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* Stage 1: Envelope Cover */
    .cover-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 36px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cover-card.hide {
      opacity: 0;
      transform: scale(0.85) translateY(-20px);
      pointer-events: none;
      display: none;
    }

    .stars-top {
      font-size: 1.1rem;
      letter-spacing: 6px;
      color: #fde047;
      margin-bottom: 10px;
      animation: pulse 2s infinite ease-in-out;
    }

    .badge-date {
      display: inline-block;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .apple-icon {
      font-size: 3.4rem;
      display: block;
      margin: 4px auto 12px;
      animation: bounce 2.2s infinite ease-in-out;
      filter: drop-shadow(0 6px 12px rgba(239, 68, 68, 0.35));
    }

    h1.main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.95rem;
      line-height: 1.25;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #93c5fd, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .from-tag {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Envelope Preview Box */
    .envelope-box {
      background: linear-gradient(145deg, rgba(30, 58, 138, 0.6), rgba(15, 23, 42, 0.8));
      border: 1.5px dashed rgba(147, 197, 253, 0.45);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .envelope-label {
      font-family: 'Sacramento', cursive;
      font-size: 2rem;
      color: #fde047;
      margin-bottom: 6px;
    }

    .btn-open {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-open:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.65);
    }

    .btn-open:active {
      transform: scale(0.97);
    }

    /* Stage 2: Letter Card */
    .letter-card {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      animation: popIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .letter-card.show {
      display: block;
    }

    .sticker-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 50%;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .sticker-wrapper img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 50%;
    }

    .letter-heading {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.45rem;
      color: #fde047;
      margin-bottom: 14px;
    }

    .message-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px;
      min-height: 165px;
      text-align: left;
      font-size: 0.96rem;
      line-height: 1.7;
      color: #f1f5f9;
      margin-bottom: 20px;
      position: relative;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: #38bdf8;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
    }

    .action-row.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-reply {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      transition: transform 0.2s ease;
    }

    .btn-reply:hover {
      transform: translateY(-2px);
    }

    .btn-replay {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 12px 18px;
      border-radius: 999px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-replay:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Music Button */
    .music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    .music-toggle.playing {
      animation: spinSlow 5s linear infinite;
      border-color: #fde047;
      color: #fde047;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(25px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Floating Particles -->
  <div class="bg-particles" id="particles"></div>

  <!-- Audio (Musik Latar) -->
  <audio id="bgMusic" loop>
    <source src="https://feeldreams.github.io/audio/thousand.mp3" type="audio/mpeg">
  </audio>

  <button class="music-toggle" id="musicBtn" title="Putar / Jeda Musik">♪♫</button>

  <main class="container">
    <!-- COVER / AMPLOP AWAL -->
    <section class="cover-card" id="coverCard">
      <div class="stars-top">★★ 🍎 ★★</div>
      <div class="badge-date">25 November 2026</div>
      <h1 class="main-title">Selamat Hari Guru Nasional</h1>
      <p class="subtitle">
        Terima kasih, Bapak &amp; Ibu Guru,<br />
        pahlawan tanpa tanda jasa 💙
      </p>

      <div class="envelope-box">
        <div class="envelope-label">Untuk Guruku</div>
        <span class="apple-icon">🍎</span>
        <p class="from-tag">Teruntuk Guruku 🫶 dari murid-muridmu</p>
        <button class="btn-open" id="openBtn">
          <span>✉️</span> Buka Surat
        </button>
      </div>
    </section>

    <!-- ISI SURAT / KARTU UCAPAN -->
    <section class="letter-card" id="letterCard">
      <div class="sticker-wrapper">
        <img id="stickerImg" src="https://htmlku.com/0/panda/hearthappy.gif" alt="Stiker Lucu" />
      </div>
      <h2 class="letter-heading">Selamat Hari Guru! 🍎💙</h2>
      <div class="message-box">
        <span id="typedText"></span><span class="cursor" id="cursor"></span>
      </div>
      <div class="action-row" id="actionRow">
        <a class="btn-reply" id="replyBtn" href="#" target="_blank" rel="noopener noreferrer">
          💌 Balas
        </a>
        <button class="btn-replay" id="replayBtn">🔄 Ulangi</button>
      </div>
    </section>
  </main>

  <script>
    // ==========================================
    // KONFIGURASI TEKS & NOMOR WHATSAPP BALASAN
    // ==========================================
    const CONFIG = {
      pesanUcapan:
        "Terima kasih atas setiap ilmu, kesabaran, dan ketulusan Bapak/Ibu dalam membimbing kami setiap hari. " +
        "Tanpa lelah Bapak/Ibu menyalakan pelita pengetahuan agar kami berani bermimpi dan melangkah maju. " +
        "Semoga Bapak/Ibu Guru selalu diberikan kesehatan, kebahagiaan, dan keberkahan. Selamat Hari Guru Nasional! 💙🍎",
      stikerAwal: "https://htmlku.com/0/panda/hearthappy.gif",
      stikerAkhir: "https://htmlku.com/0/panda/muah.gif",
      nomorWhatsApp: "", // Isi nomor WA jika ingin langsung ke chat tertentu, misal: "6281234567890"
      teksBalasanWA: "Terima kasih banyak atas ucapan dan doanya di Hari Guru ini! 💙🍎"
    };

    // Generate Floating Particles
    const particlesContainer = document.getElementById("particles");
    const icons = ["🍎", "💙", "✨", "⭐", "📚", "🎓"];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement("span");
      el.className = "particle";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 8 + Math.random() * 10 + "s";
      el.style.animationDelay = Math.random() * 8 + "s";
      el.style.fontSize = 0.9 + Math.random() * 0.9 + "rem";
      particlesContainer.appendChild(el);
    }

    // Elements
    const coverCard = document.getElementById("coverCard");
    const letterCard = document.getElementById("letterCard");
    const openBtn = document.getElementById("openBtn");
    const replayBtn = document.getElementById("replayBtn");
    const replyBtn = document.getElementById("replyBtn");
    const typedText = document.getElementById("typedText");
    const cursor = document.getElementById("cursor");
    const stickerImg = document.getElementById("stickerImg");
    const actionRow = document.getElementById("actionRow");
    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");

    let typingTimer = null;
    let isPlaying = false;

    // Setup WhatsApp Reply Link
    const encodedMsg = encodeURIComponent(CONFIG.teksBalasanWA);
    replyBtn.href = CONFIG.nomorWhatsApp
      ? `https://wa.me/${CONFIG.nomorWhatsApp}?text=${encodedMsg}`
      : `https://api.whatsapp.com/send?text=${encodedMsg}`;

    // Music Control
    function playMusic() {
      bgMusic.play().then(() => {
        isPlaying = true;
        musicBtn.classList.add("playing");
      }).catch(() => {
        isPlaying = false;
      });
    }

    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        musicBtn.classList.remove("playing");
      } else {
        playMusic();
      }
    });

    // Typewriter Effect
    function startTyping() {
      clearInterval(typingTimer);
      typedText.textContent = "";
      cursor.style.display = "inline-block";
      actionRow.classList.remove("visible");
      stickerImg.src = CONFIG.stikerAwal;

      let idx = 0;
      const text = CONFIG.pesanUcapan;

      typingTimer = setInterval(() => {
        if (idx < text.length) {
          typedText.textContent += text.charAt(idx);
          idx++;
        } else {
          clearInterval(typingTimer);
          cursor.style.display = "none";
          stickerImg.src = CONFIG.stikerAkhir;
          actionRow.classList.add("visible");
        }
      }, 38);
    }

    // Open Letter Event
    openBtn.addEventListener("click", () => {
      playMusic();
      coverCard.classList.add("hide");
      letterCard.classList.add("show");
      startTyping();
    });

    // Replay Event
    replayBtn.addEventListener("click", () => {
      startTyping();
    });
  </script>
</body>
</html>
